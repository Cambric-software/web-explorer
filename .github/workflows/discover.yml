name: Discovery engine
# Every hour (public repository: GitHub Actions minutes are free and unlimited).
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
  issues: {types: [labeled]}
permissions: {contents: write, issues: read}
concurrency: {group: website-discovery, cancel-in-progress: false}
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests
      - run: python engine/crawl.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: python engine/screenshots.py
      - run: python engine/publish.py
      - name: Save results (control-room edits made during the run win)
        run: |
          git config user.name "website-explorer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "Discovery run: $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X ours origin main || { git rebase --abort; exit 1; }
            python -c "import json; json.load(open('docs/data/sites.json'))" || { echo "merge broke the database; skipping this run"; exit 1; }
          done
          exit 1
