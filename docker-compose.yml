services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks worker -l info
    depends_on: [api]
  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks beat -l info
    depends_on: [api]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata:
